name: pm_quanlyquancf
description: "Phần mềm Quản lý Quán Cà phê Gia Đình tối ưu cho người lớn tuổi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Ecosystem
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.19.7

  # State Management
  flutter_riverpod: ^2.5.1

  # Caching & Offline
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3

  # Audio & Device
  audioplayers: ^6.0.0
  wakelock_plus: ^1.2.5

  # Utilities & Networking
  intl: ^0.19.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
