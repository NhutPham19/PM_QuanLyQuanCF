<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      width: 1024px;
      height: 1024px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Background Gradient: Espresso to Caramel Amber -->
      <linearGradient id="bgGrad" x1="120" y1="80" x2="900" y2="940" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#2D150B" />
        <stop offset="50%" stop-color="#462112" />
        <stop offset="100%" stop-color="#8B4513" />
      </linearGradient>

      <!-- Golden Crema Radial Glow -->
      <radialGradient id="cremaGlow" cx="512" cy="460" r="420" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
        <stop offset="60%" stop-color="#D97706" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0" />
      </radialGradient>

      <!-- Inner Gold Ring Gradient -->
      <linearGradient id="goldRing" x1="200" y1="160" x2="824" y2="864" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.7" />
        <stop offset="50%" stop-color="#D97706" stop-opacity="0.3" />
        <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6" />
      </linearGradient>

      <!-- Cup Gradient: Crisp White Ceramic with Soft Lighting -->
      <linearGradient id="cupGrad" x1="320" y1="360" x2="704" y2="760" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="70%" stop-color="#F8FAFC" />
        <stop offset="100%" stop-color="#E2E8F0" />
      </linearGradient>

      <!-- Coffee Liquid Gradient Inside Cup -->
      <linearGradient id="liquidGrad" x1="400" y1="460" x2="624" y2="560" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#6B3410" />
        <stop offset="60%" stop-color="#451A03" />
        <stop offset="100%" stop-color="#260F02" />
      </linearGradient>

      <!-- Steam Gradient -->
      <linearGradient id="steamGrad" x1="512" y1="180" x2="512" y2="380" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9" />
        <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.7" />
        <stop offset="100%" stop-color="#D97706" stop-opacity="0.1" />
      </linearGradient>

      <!-- Bean Gradient -->
      <linearGradient id="beanGrad" x1="480" y1="720" x2="560" y2="800" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#78350F" />
        <stop offset="50%" stop-color="#451A03" />
        <stop offset="100%" stop-color="#1E0B02" />
      </linearGradient>

      <!-- Drop Shadows -->
      <filter id="shadowBig" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.55" />
      </filter>
      <filter id="shadowCup" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F0502" flood-opacity="0.45" />
      </filter>
      <filter id="glowSteam" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- 1. BASE CONTAINER (Squircle App Icon) -->
    <rect x="32" y="32" width="960" height="960" rx="230" fill="url(#bgGrad)" filter="url(#shadowBig)" />
    <!-- Crema Glow -->
    <circle cx="512" cy="500" r="420" fill="url(#cremaGlow)" />
    <!-- Inner Gold Border Accent -->
    <rect x="48" y="48" width="928" height="928" rx="214" stroke="url(#goldRing)" stroke-width="6" fill="none" />

    <!-- 2. STEAM WAVES (Delicate & Aromatic) -->
    <g filter="url(#glowSteam)">
      <!-- Left Steam -->
      <path d="M420 380 C390 330 430 290 400 240 C380 205 405 180 415 160" 
            stroke="url(#steamGrad)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.75" />
      <!-- Center Steam (Tallest) -->
      <path d="M512 370 C480 310 540 260 512 200 C495 165 525 140 535 120" 
            stroke="url(#steamGrad)" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.9" />
      <!-- Right Steam -->
      <path d="M604 380 C634 330 594 290 624 240 C644 205 619 180 609 160" 
            stroke="url(#steamGrad)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.75" />
    </g>

    <!-- 3. COFFEE CUP & SAUCER -->
    <!-- Saucer (Đĩa lót ly) -->
    <ellipse cx="512" cy="740" rx="290" ry="46" fill="#CBD5E1" filter="url(#shadowCup)" />
    <ellipse cx="512" cy="734" rx="278" ry="40" fill="#F1F5F9" />
    <ellipse cx="512" cy="730" rx="230" ry="30" fill="#E2E8F0" />

    <!-- Cup Shadow -->
    <path d="M340 430 Q340 680 512 680 Q684 680 684 430 Z" fill="#000000" opacity="0.25" transform="translate(0, 16)" />

    <!-- Cup Handle (Quai ly bên phải) -->
    <path d="M640 460 C745 460 760 610 630 630" 
          stroke="url(#cupGrad)" stroke-width="36" stroke-linecap="round" fill="none" filter="url(#shadowCup)" />
    <path d="M640 472 C720 472 730 595 635 618" 
          stroke="#E2E8F0" stroke-width="16" stroke-linecap="round" fill="none" />

    <!-- Cup Body (Thân ly cà phê sứ trắng) -->
    <path d="M330 420 C332 580 400 685 512 685 C624 685 692 580 694 420 Z" 
          fill="url(#cupGrad)" filter="url(#shadowCup)" />
    
    <!-- Cup Rim & Interior Liquid (Miệng ly & Nước cà phê) -->
    <ellipse cx="512" cy="420" rx="182" ry="42" fill="#E2E8F0" />
    <ellipse cx="512" cy="422" rx="174" ry="38" fill="url(#liquidGrad)" />
    
    <!-- Latte Art Heart in Center (Hình trái tim latte nghệ thuật) -->
    <path d="M512 445 C512 445 460 415 460 395 C460 380 475 372 492 372 C504 372 512 382 512 382 C512 382 520 372 532 372 C549 372 564 380 564 395 C564 415 512 445 512 445 Z" 
          fill="#FEF3C7" opacity="0.85" />
    <ellipse cx="512" cy="402" rx="42" ry="10" fill="#FDE68A" opacity="0.4" />

    <!-- Ceramic Highlight Glaze (Vết bóng ánh sáng trên thành sứ) -->
    <path d="M360 440 C364 560 410 645 470 668 C440 645 405 565 400 440 Z" 
          fill="#FFFFFF" opacity="0.65" />

    <!-- 4. ROASTED COFFEE BEANS ACCENT (2 Hạt Cà Phê Trước Đĩa) -->
    <!-- Left Bean -->
    <g transform="translate(450, 775) rotate(-24) scale(0.72)" filter="url(#shadowCup)">
      <ellipse cx="0" cy="0" rx="44" ry="62" fill="url(#beanGrad)" />
      <!-- Bean Center Groove -->
      <path d="M0 -54 Q-12 0 0 54" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M-6 -50 Q-18 0 -6 50" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
    </g>

    <!-- Right Bean -->
    <g transform="translate(565, 785) rotate(32) scale(0.66)" filter="url(#shadowCup)">
      <ellipse cx="0" cy="0" rx="44" ry="62" fill="url(#beanGrad)" />
      <!-- Bean Center Groove -->
      <path d="M0 -54 Q10 0 0 54" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M6 -50 Q16 0 6 50" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
    </g>

    <!-- 5. BRAND EMBLEM TEXT BANNER (Tùy chọn dưới cùng) -->
    <!-- Golden Star / Dot accent -->
    <circle cx="512" cy="880" r="6" fill="#F59E0B" />
    <circle cx="488" cy="880" r="3" fill="#D97706" opacity="0.7" />
    <circle cx="536" cy="880" r="3" fill="#D97706" opacity="0.7" />
  </svg>
</body>
</html>
